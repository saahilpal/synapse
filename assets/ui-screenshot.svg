<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="browser-clip">
      <rect width="800" height="450" rx="8" />
    </clipPath>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g clip-path="url(#browser-clip)">
    <!-- Browser Background -->
    <rect width="800" height="450" fill="#0f172a" />
    
    <!-- Top Bar -->
    <rect width="800" height="40" fill="#1e293b" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" />
    <circle cx="40" cy="20" r="6" fill="#f59e0b" />
    <circle cx="60" cy="20" r="6" fill="#10b981" />
    <rect x="80" y="10" width="640" height="20" rx="4" fill="#0f172a" />
    <text x="400" y="24" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">localhost:9876 / Context UI</text>

    <!-- Sidebar Left (Files) -->
    <rect x="0" y="40" width="200" height="410" fill="#020617" />
    <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" letter-spacing="1">REPOSITORY</text>
    <g font-family="sans-serif" font-size="12" fill="#94a3b8">
      <text x="20" y="100">📁 src</text>
      <text x="35" y="125">📁 synapse</text>
      <text x="50" y="150" fill="#3b82f6">📄 runtime.py</text>
      <text x="50" y="175">📄 parser.py</text>
      <text x="50" y="200">📄 engine.py</text>
      <text x="20" y="235">📁 tests</text>
      <text x="35" y="260">📄 test_runtime.py</text>
    </g>

    <!-- Main Graph Area -->
    <rect x="200" y="40" width="400" height="410" fill="#0f172a" />
    
    <!-- Graph Edges -->
    <path d="M 400 150 L 320 250 M 400 150 L 480 250 M 320 250 L 320 330" stroke="#334155" stroke-width="2" fill="none" />
    
    <!-- Graph Nodes -->
    <circle cx="400" cy="150" r="24" fill="#1e40af" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="400" y="195" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">runtime.py</text>

    <circle cx="320" cy="250" r="18" fill="#166534" stroke="#10b981" stroke-width="2" />
    <text x="320" y="285" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">class Daemon</text>

    <circle cx="480" cy="250" r="18" fill="#5b21b6" stroke="#8b5cf6" stroke-width="2" />
    <text x="480" y="285" font-family="monospace" font-size="10" fill="#ddd6fe" text-anchor="middle">import Engine</text>

    <circle cx="320" cy="330" r="14" fill="#334155" stroke="#475569" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="320" y="360" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">overlay_note</text>

    <!-- Sidebar Right (Details) -->
    <rect x="600" y="40" width="200" height="410" fill="#020617" stroke-left="#1e293b" />
    <text x="620" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" letter-spacing="1">NODE INSPECTOR</text>
    
    <rect x="620" y="90" width="160" height="24" rx="4" fill="#1e293b" />
    <text x="630" y="106" font-family="monospace" font-size="11" fill="#3b82f6">Type: Class</text>

    <text x="620" y="140" font-family="sans-serif" font-size="11" fill="#94a3b8">Name:</text>
    <text x="620" y="160" font-family="monospace" font-size="12" fill="#f8fafc">Daemon</text>

    <text x="620" y="200" font-family="sans-serif" font-size="11" fill="#94a3b8">Hash:</text>
    <text x="620" y="220" font-family="monospace" font-size="10" fill="#f59e0b">a8f93e1b...</text>

    <text x="620" y="260" font-family="sans-serif" font-size="11" fill="#94a3b8">Semantic Overlay:</text>
    <rect x="620" y="270" width="160" height="60" rx="4" fill="#1e293b" />
    <text x="630" y="290" font-family="sans-serif" font-size="10" fill="#cbd5e1">"Manages background</text>
    <text x="630" y="305" font-family="sans-serif" font-size="10" fill="#cbd5e1">scanning and temporal</text>
    <text x="630" y="320" font-family="sans-serif" font-size="10" fill="#cbd5e1">invalidation."</text>
  </g>
</svg>