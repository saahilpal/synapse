<svg width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="240" fill="url(#bg)" rx="12" ry="12"/>

  <!-- Background Grid -->
  <g stroke="#333" stroke-width="0.5" opacity="0.3">
    <path d="M 0 40 L 800 40 M 0 80 L 800 80 M 0 120 L 800 120 M 0 160 L 800 160 M 0 200 L 800 200" />
    <path d="M 100 0 L 100 240 M 200 0 L 200 240 M 300 0 L 300 240 M 400 0 L 400 240 M 500 0 L 500 240 M 600 0 L 600 240 M 700 0 L 700 240" />
  </g>

  <!-- Abstract Structure Graph -->
  <g transform="translate(400, 100)">
    <path d="M-200,-40 C-100,-40 -50,60 0,20 S100,-40 200,30" stroke="url(#primary)" stroke-width="3" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M-150,50 L-50,0 L50,50 L150,-10" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.5"/>
    <path d="M-100,-20 L0,-60 L100,-20" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2,2" fill="none" opacity="0.4"/>
    
    <!-- Data Points -->
    <circle cx="-200" cy="-40" r="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="-150" cy="50" r="4" fill="#3b82f6"/>
    <circle cx="-100" cy="-20" r="4" fill="#8b5cf6"/>
    <circle cx="-50" cy="0" r="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="0" cy="-60" r="4" fill="#3b82f6"/>
    <circle cx="0" cy="20" r="10" fill="#1e293b" stroke="#f8fafc" stroke-width="2" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="4" fill="#3b82f6"/>
    <circle cx="100" cy="-20" r="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="150" cy="-10" r="4" fill="#3b82f6"/>
    <circle cx="200" cy="30" r="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <g transform="translate(400, 140)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="6">SYNAPSE</text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="2">PERSISTENT STRUCTURAL CONTEXT FOR AI AGENTS</text>
  </g>
</svg>
