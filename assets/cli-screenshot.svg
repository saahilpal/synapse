<svg width="800" height="340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="terminal-clip">
      <rect width="800" height="340" rx="8" />
    </clipPath>
  </defs>

  <g clip-path="url(#terminal-clip)">
    <!-- Terminal Background -->
    <rect width="800" height="340" fill="#0d1117" />
    
    <!-- Top Bar -->
    <rect width="800" height="32" fill="#1e293b" />
    <circle cx="20" cy="16" r="6" fill="#ef4444" />
    <circle cx="40" cy="16" r="6" fill="#f59e0b" />
    <circle cx="60" cy="16" r="6" fill="#10b981" />
    <text x="400" y="21" font-family="sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">synapse — -bash — 80x24</text>

    <!-- Terminal Content -->
    <g font-family="'Menlo', 'Monaco', 'Courier New', monospace" font-size="13" fill="#f8fafc">
      <!-- Command 1 -->
      <text x="20" y="65"><tspan fill="#10b981">➜</tspan> <tspan fill="#3b82f6">~</tspan> synapse init .</text>
      <text x="20" y="85" fill="#94a3b8">Indexing repository...</text>
      <text x="20" y="105" fill="#94a3b8">✓ Computed hashes for 142 files.</text>
      <text x="20" y="125" fill="#94a3b8">✓ Extracted 312 structural nodes (classes, functions, imports).</text>
      <text x="20" y="145" fill="#10b981">Initialization complete. Active head: 7a8b9c2</text>

      <!-- Command 2 -->
      <text x="20" y="185"><tspan fill="#10b981">➜</tspan> <tspan fill="#3b82f6">~</tspan> synapse search "How does context replay work?"</text>
      <text x="20" y="210" fill="#8b5cf6">Reconstructing temporal graph at head 7a8b9c2...</text>
      <text x="20" y="230" fill="#94a3b8">↳ Found Match: <tspan fill="#f8fafc" font-weight="bold">src/synapse/replay/engine.py</tspan></text>
      <text x="20" y="250" fill="#94a3b8">  ↳ <tspan fill="#3b82f6">Class</tspan> ContextTransactionEngine</text>
      <text x="20" y="270" fill="#94a3b8">  ↳ <tspan fill="#3b82f6">Function</tspan> replay_events(from_commit, to_commit)</text>
      <text x="20" y="290" fill="#94a3b8">  ↳ <tspan fill="#10b981">Semantic Overlay:</tspan> "Handles diagnostic bounded reconstruction."</text>
      <text x="20" y="315" fill="#cbd5e1">Packed 845 tokens. Context window ready for MCP.</text>
    </g>
  </g>
</svg>