<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#bg)" rx="12" ry="12"/>

  <!-- Split Line -->
  <line x1="400" y1="60" x2="400" y2="360" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Left Side: Naive RAG -->
  <g transform="translate(0, 0)">
    <text x="200" y="50" font-family="sans-serif" font-size="18" font-weight="700" fill="#ef4444" text-anchor="middle">Naive RAG (Text Chunks)</text>

    <!-- Unstructured Chunks -->
    <rect x="100" y="100" width="200" height="40" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" opacity="0.8"/>
    <text x="200" y="125" font-family="monospace" font-size="11" fill="#fca5a5" text-anchor="middle">def auth(req): # ...</text>

    <rect x="60" y="160" width="180" height="40" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" opacity="0.6"/>
    <text x="150" y="185" font-family="monospace" font-size="11" fill="#fca5a5" text-anchor="middle">import hashlib</text>

    <rect x="160" y="220" width="200" height="40" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" opacity="0.9"/>
    <text x="260" y="245" font-family="monospace" font-size="11" fill="#fca5a5" text-anchor="middle">class User: pass</text>

    <rect x="80" y="280" width="160" height="40" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
    <text x="160" y="305" font-family="monospace" font-size="11" fill="#fca5a5" text-anchor="middle"># old commented code</text>

    <!-- Cross marks -->
    <path d="M 120 180 L 130 190 M 130 180 L 120 190" stroke="#ef4444" stroke-width="2"/>
    <path d="M 280 200 L 290 210 M 290 200 L 280 210" stroke="#ef4444" stroke-width="2"/>

    <text x="200" y="350" font-family="sans-serif" font-size="13" font-weight="500" fill="#f87171" text-anchor="middle">Broken context, lost boundaries, stale code.</text>
  </g>

  <!-- Right Side: Synapse -->
  <g transform="translate(400, 0)">
    <text x="200" y="50" font-family="sans-serif" font-size="18" font-weight="700" fill="#3b82f6" text-anchor="middle">Synapse (Bounded Structure)</text>

    <!-- Graph Structure -->
    <path d="M 200 120 L 130 200 M 200 120 L 270 200 M 130 200 L 130 280 M 270 200 L 270 280" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>

    <!-- Root Node -->
    <rect x="140" y="100" width="120" height="40" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="200" y="125" font-family="monospace" font-size="12" font-weight="bold" fill="#bfdbfe" text-anchor="middle">auth_module</text>

    <!-- Child Nodes -->
    <rect x="70" y="180" width="120" height="40" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="130" y="205" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">class User</text>

    <rect x="210" y="180" width="120" height="40" rx="8" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="270" y="205" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">fn verify_token()</text>

    <!-- Deep Nodes -->
    <rect x="70" y="260" width="120" height="40" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="130" y="285" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Overlay: User Model</text>

    <rect x="210" y="260" width="120" height="40" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="270" y="285" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">import jwt</text>

    <text x="200" y="350" font-family="sans-serif" font-size="13" font-weight="500" fill="#60a5fa" text-anchor="middle">Deterministic graphs, exact boundaries.</text>
  </g>
</svg>
