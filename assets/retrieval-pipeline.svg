<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="300" fill="url(#bg)" rx="12" ry="12"/>

  <!-- Arrows & Paths -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M 120 150 L 180 150" marker-end="url(#arrow)" />
    <path d="M 280 150 L 340 150" marker-end="url(#arrow)" />
    <path d="M 440 150 L 500 150" marker-end="url(#arrow)" />
    <path d="M 600 150 L 660 150" marker-end="url(#arrow)" />
  </g>

  <!-- Node 1: Raw Code -->
  <g transform="translate(40, 110)">
    <rect width="80" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="40" y="45" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">.py / .ts</text>
    <text x="40" y="80" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Raw Repo</text>
  </g>

  <!-- Node 2: Structural Extraction -->
  <g transform="translate(180, 110)">
    <rect width="100" height="80" rx="8" fill="#1e293b" stroke="url(#blueGradient)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="50" cy="35" r="14" fill="#3b82f6" opacity="0.2"/>
    <path d="M 40 35 L 50 25 L 60 35 M 50 25 L 50 45" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <text x="50" y="70" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">AST Parsing</text>
  </g>

  <!-- Node 3: Temporal Filter -->
  <g transform="translate(340, 110)">
    <rect width="100" height="80" rx="8" fill="#1e293b" stroke="url(#purpleGradient)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="50" cy="35" r="14" fill="#8b5cf6" opacity="0.2"/>
    <circle cx="50" cy="35" r="8" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
    <text x="50" y="70" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Temporal Filter</text>
  </g>

  <!-- Node 4: Hybrid Retrieval -->
  <g transform="translate(500, 110)">
    <rect width="100" height="80" rx="8" fill="#1e293b" stroke="url(#greenGradient)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="50" cy="35" r="14" fill="#10b981" opacity="0.2"/>
    <path d="M 42 35 A 8 8 0 1 1 58 35 A 8 8 0 1 1 42 35" stroke="#10b981" stroke-width="2" fill="none"/>
    <path d="M 54 41 L 62 49" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="70" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Hybrid Search</text>
  </g>

  <!-- Node 5: Agent Context -->
  <g transform="translate(660, 110)">
    <rect width="100" height="80" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
    <text x="50" y="35" font-family="sans-serif" font-size="20" fill="#f8fafc" text-anchor="middle">🤖</text>
    <text x="50" y="70" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Agent Context</text>
  </g>

  <!-- Title -->
  <text x="400" y="50" font-family="sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">SYNAPSE PIPELINE</text>
  <text x="400" y="75" font-family="sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">From raw repository to structurally-grounded agent memory</text>
</svg>