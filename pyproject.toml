[project]
name = "synapse-runtime"
version = "0.1.0"
description = "Persistent structural context infrastructure for AI coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Synapse contributors" }]
keywords = ["ai", "mcp", "git", "context", "developer-tools", "repository-indexing"]
dependencies = [
  "fastapi>=0.115",
  "gitpython>=3.1",
  "markdown-it-py>=3.0",
  "mcp>=1.27.1",
  "msgpack>=1.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
synapse = "synapse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "UP", "W"]
ignore = ["B008", "E501", "B904", "B007", "F841", "W291"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["msgpack"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "replay: deterministic event replay tests",
  "rollback: context rollback integrity tests",
  "integration: tests that touch filesystem or external services",
]
