[project]
name = "synapse-runtime"
version = "0.2.0"
description = "Persistent structural context infrastructure for AI coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Synapse contributors" }]
keywords = ["ai", "mcp", "git", "context", "developer-tools", "repository-indexing"]
dependencies = [
  "click==8.1.8",
  "fastapi==0.115.11",
  "gitpython==3.1.44",
  "keyring==25.6.0",
  "markdown-it-py==3.0.0",
  "mcp==1.3.0",
  "msgpack==1.1.0",
  "pydantic==2.10.6",
  "pydantic-settings==2.8.1",
  "structlog==25.1.0",
  "tiktoken==0.9.0",
  "tree-sitter==0.20.4",
  "tree-sitter-languages==1.10.2",
  "typer==0.15.1",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.3",
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pre-commit==4.1.0",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "pytest-cov==6.0.0",
  "ruff==0.9.9",
]

[project.scripts]
synapse = "synapse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "UP", "W", "S", "PT", "ARG", "PTH"]
ignore = ["B008", "E501", "B904", "B007", "F841", "W291", "S101", "S105", "S106", "ARG001", "ARG002", "S110", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["msgpack"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: tests that touch filesystem or external services",
  "benchmark: performance/stress tests that take longer to run",
]
