<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse Diagnostics</title>
    <style>
        :root { --bg: #0f172a; --text: #f8fafc; --border: #334155; --accent: #38bdf8; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .card { background: #1e293b; border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; }
        .card h2 { margin-top: 0; color: var(--accent); font-size: 1.25rem; }
        .stat { font-size: 2rem; font-weight: bold; margin: 0.5rem 0; }
        .label { color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        th { color: #94a3b8; font-weight: 500; }
        code { background: #000; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; }
        .status-ok { color: #4ade80; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 style="margin:0; font-size: 1.5rem;">Synapse <span style="font-weight: 300; opacity: 0.7;">Diagnostics</span></h1>
            <p id="repo-path" style="margin: 0.25rem 0 0 0; font-size: 0.875rem; color: #94a3b8;">Loading...</p>
        </div>
        <div id="system-status" class="status-ok">● Runtime Active</div>
    </header>

    <div class="grid">
        <div class="card">
            <h2>Index Health</h2>
            <div style="display: flex; gap: 2rem;">
                <div><div class="stat" id="stat-files">-</div><div class="label">Files</div></div>
                <div><div class="stat" id="stat-symbols">-</div><div class="label">Symbols</div></div>
            </div>
            <p id="active-commit" style="margin-top: 1.5rem; font-size: 0.875rem;">HEAD: <code>-</code></p>
        </div>

        <div class="card">
            <h2>Latest Retrieval Trace</h2>
            <p id="trace-query" style="font-style: italic;">No recent queries</p>
            <table id="trace-table">
                <thead>
                    <tr><th>Symbol</th><th>Reason</th><th>Tokens</th></tr>
                </thead>
                <tbody>
                    <tr><td colspan="3" style="text-align:center; color:#64748b;">Waiting for retrieval event...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const res = await fetch('/api/v1/status');
                const data = await res.json();
                document.getElementById('repo-path').textContent = data.repository_path;
                document.getElementById('stat-files').textContent = data.files;
                document.getElementById('stat-symbols').textContent = data.symbols;
                document.getElementById('active-commit').innerHTML = `HEAD: <code>${data.git_commit?.substring(0,8) || 'unknown'}</code>`;
            } catch (e) { console.error(e); }
        }

        async function updateTrace() {
            try {
                const res = await fetch('/api/v1/trace/latest');
                const data = await res.json();
                if (data.status !== 'ready') return;
                // Update table with data if available
            } catch (e) { console.error(e); }
        }

        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>
</html>
