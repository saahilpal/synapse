<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse Operational Dashboard</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-hover: #27272a;
            --border: #27272a;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent: #3b82f6;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --font-sans: 'Inter', -apple-system, system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; }
        h2 { margin: 0 0 1rem 0; font-size: 1.125rem; font-weight: 500; color: var(--text-primary); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;}

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .stat-box {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 0.375rem;
        }

        .stat-value { font-size: 1.5rem; font-weight: 600; font-family: var(--font-mono); }
        .stat-label { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }

        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
        th { color: var(--text-secondary); font-weight: 500; }

        code {
            background: var(--bg);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-family: var(--font-mono);
            font-size: 0.8125rem;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .empty-state {
            color: var(--text-secondary);
            text-align: center;
            padding: 2rem;
            font-style: italic;
            background: var(--bg);
            border-radius: 0.375rem;
            border: 1px dashed var(--border);
        }

        .row-hover:hover {
            background: var(--bg);
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Synapse <span style="color: var(--text-secondary); font-weight: 400;">Operations</span></h1>
            <p id="repo-path" style="margin: 0.25rem 0 0 0; font-size: 0.875rem; color: var(--text-secondary); font-family: var(--font-mono);">Connecting...</p>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            Daemon Active
        </div>
    </header>

    <div class="grid">
        <!-- Index Health -->
        <div class="card">
            <h2>State Overview</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="stat-files">-</div>
                    <div class="stat-label">Indexed Files</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="stat-symbols">-</div>
                    <div class="stat-label">Symbols Extracted</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="stat-branch">-</div>
                    <div class="stat-label">Active Branch</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="stat-commit" style="font-size: 1rem; margin-top:0.3rem;">-</div>
                    <div class="stat-label">HEAD OID</div>
                </div>
            </div>
        </div>

        <!-- Checkpoints -->
        <div class="card" style="grid-row: span 2;">
            <h2>Recent Checkpoints</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Action</th>
                        <th>Branch</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="checkpoints-body">
                    <tr><td colspan="4" class="empty-state">Loading checkpoints...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Lessons (Memory) -->
        <div class="card">
            <h2>Pending Lessons (Reverts)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Commit</th>
                        <th>Issue</th>
                        <th>Files Affected</th>
                    </tr>
                </thead>
                <tbody id="lessons-body">
                    <tr><td colspan="3" class="empty-state">Loading lessons...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function timeAgo(timestamp) {
            const seconds = Math.floor((new Date() - new Date(timestamp * 1000)) / 1000);
            if (seconds < 60) return `${seconds}s ago`;
            if (seconds < 3600) return `${Math.floor(seconds/60)}m ago`;
            return `${Math.floor(seconds/3600)}h ago`;
        }

        async function updateDashboard() {
            try {
                // Fetch Status
                const statusRes = await fetch('/api/v1/status');
                const status = await statusRes.json();

                document.getElementById('repo-path').textContent = status.repository_path;
                document.getElementById('stat-files').textContent = status.files.toLocaleString();
                document.getElementById('stat-symbols').textContent = status.symbols.toLocaleString();
                document.getElementById('stat-branch').textContent = status.branch;
                document.getElementById('stat-commit').innerHTML = `<code>${status.git_commit?.substring(0,7) || 'unknown'}</code>`;

                // Fetch Checkpoints
                const cpRes = await fetch('/api/v1/checkpoints');
                const cpData = await cpRes.json();
                const cpBody = document.getElementById('checkpoints-body');
                if (cpData.checkpoints && cpData.checkpoints.length > 0) {
                    cpBody.innerHTML = cpData.checkpoints.map(cp => `
                        <tr class="row-hover">
                            <td><code>${cp.checkpoint_id.split('-')[0]}</code></td>
                            <td>${cp.doing}</td>
                            <td><span style="border:1px solid var(--border); padding:2px 6px; border-radius:4px; font-size:11px;">${cp.branch}</span></td>
                            <td style="color:var(--text-secondary);">${timeAgo(cp.created_at)}</td>
                        </tr>
                    `).join('');
                } else {
                    cpBody.innerHTML = `<tr><td colspan="4" class="empty-state">No checkpoints recorded yet.</td></tr>`;
                }

                // Fetch Lessons
                const memRes = await fetch('/api/v1/memory');
                const memData = await memRes.json();
                const lessonBody = document.getElementById('lessons-body');
                if (memData.pending && memData.pending.length > 0) {
                    lessonBody.innerHTML = memData.pending.map(l => {
                        let files = [];
                        try { files = JSON.parse(l.files_affected); } catch(e){}
                        return `
                        <tr class="row-hover">
                            <td><code>${l.revert_commit.substring(0,7)}</code></td>
                            <td>${l.what_failed}</td>
                            <td>${files.length} files</td>
                        </tr>
                        `;
                    }).join('');
                } else {
                    lessonBody.innerHTML = `<tr><td colspan="3" class="empty-state">System stable. No pending lessons.</td></tr>`;
                }

            } catch (e) {
                console.error("Dashboard update failed:", e);
                document.querySelector('.status-badge').style.color = 'var(--danger)';
                document.querySelector('.status-badge').style.background = 'rgba(239, 68, 68, 0.1)';
                document.querySelector('.status-badge').style.borderColor = 'rgba(239, 68, 68, 0.2)';
                document.querySelector('.status-badge').innerHTML = '<div class="status-dot"></div> Connection Lost';
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
