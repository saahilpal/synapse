name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Configure git identity
        run: |
          git config --global user.email "ci@synapse.local"
          git config --global user.name "Synap CI"

      - name: Run tests (excluding benchmark)
        run: uv run pytest -m "not benchmark" --cov=synap_git --cov-report=term-missing --cov-report=xml -vv -s --timeout=300 -x
        env:
          CI: "true"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  benchmark:
    name: Monorepo Stress Benchmark
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Configure git identity
        run: |
          git config --global user.email "ci@synapse.local"
          git config --global user.name "Synap CI"

      - name: Run benchmark tests
        run: uv run pytest -m "benchmark" -v --tb=short
        env:
          SYNAP_SKIP_STRESS: ""
