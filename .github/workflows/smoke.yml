name: Smoke Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    name: Smoke Tests & Artifact Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build distribution
        run: uv build

      - name: Verify CLI and Daemon
        run: |
          uv venv test_env
          source test_env/bin/activate
          uv pip install dist/*.whl

          git config --global user.email "ci@synapse.local"
          git config --global user.name "Synap CI"

          # Verify package versions
          synap --version

          # Verify initialization and daemon boot
          synap init . --skip-llm --quiet

          # Verify doctor repairs and status
          synap doctor .

          # Verify mcp transport
          synap mcp verify .
