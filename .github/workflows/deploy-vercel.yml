name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build (type-check + compilation)
        working-directory: website
        run: npm run build
