name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict type check
        run: uv run mypy src tests

      - name: Bandit security check
        run: uv run bandit -r src/ -ll

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Configure git identity (required for integration tests)
        run: |
          git config --global user.email "ci@synapse.local"
          git config --global user.name "Synapse CI"

      - name: Run tests (excluding benchmark)
        run: |
          uv run pytest -m "not benchmark" --cov=synapse --cov-report=term-missing --cov-report=xml > pytest_log.txt 2>&1 || {
            echo "=== PYTEST LOGS ==="
            cat pytest_log.txt
            echo "==================="
            git config --global user.email "ci-debug@synapse.local"
            git config --global user.name "CI Debugger"
            git checkout -b ci-debug || git checkout ci-debug
            git add pytest_log.txt
            git commit -m "ci: save pytest failure log"
            git push -f origin ci-debug
            exit 1
          }

      - name: Upload pytest log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-log
          path: pytest_log.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report
          path: coverage.xml

  benchmark:
    name: Monorepo Stress Benchmark
    runs-on: ubuntu-latest
    needs: test
    # Only run benchmarks on main branch pushes to avoid slowing down PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Configure git identity
        run: |
          git config --global user.email "ci@synapse.local"
          git config --global user.name "Synapse CI"

      - name: Run benchmark tests
        run: uv run pytest -m "benchmark" -v --tb=short
        env:
          # Unset to allow benchmarks to run against this checkout
          SYNAPSE_SKIP_STRESS: ""

  release-validation:
    name: Release Package Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build distribution
        run: uv build

      - name: Validate wheel installability
        run: |
          uv venv test_env
          source test_env/bin/activate
          uv pip install dist/*.whl

      - name: Run doctor against a real git repo
        run: |
          source test_env/bin/activate
          git config --global user.email "ci@synapse.local"
          git config --global user.name "Synapse CI"
          # synapse doctor requires an initialized repo — use the checkout itself
          synapse init . --skip-llm --quiet
          synapse doctor .
          synapse mcp verify .

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
