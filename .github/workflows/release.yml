name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  validate-tag:
    name: Validate Tag & Version Alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Tag matches Version in __init__.py
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          INIT_VERSION=$(grep -E "^__version__ = " src/synap_git/__init__.py | cut -d'"' -f2)
          echo "Tag Version: $TAG_VERSION"
          echo "Init Version: $INIT_VERSION"
          if [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
            echo "ERROR: Pushed tag v$TAG_VERSION does not match src/synap_git/__init__.py version $INIT_VERSION"
            exit 1
          fi

  build-and-test:
    name: Build & E2E Verification
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff Lint & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: MyPy Strict Type Check
        run: uv run mypy src tests

      - name: Bandit Security Scan
        run: uv run bandit -r src/ -ll

      - name: Run Tests
        run: uv run pytest -m "not benchmark"

      - name: Build Wheel & Source Dist
        run: uv build

      - name: Verify Wheel Installation
        run: |
          uv venv test_env
          source test_env/bin/activate
          uv pip install dist/*.whl
          git config --global user.email "release@synapse.local"
          git config --global user.name "Synap Release"
          synap --version
          synap --help
          synap init . --skip-llm --quiet
          synap doctor .
          synap mcp verify .
          deactivate

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 5

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: pypi
      url: https://pypi.org/p/synap-git
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true


  post-publish-smoke:
    name: Post-Publish Verification
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify PyPI Installation
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Expected Version: $TAG_VERSION"

          uv venv test_env
          source test_env/bin/activate

          # Retry loop to wait for PyPI indexing
          for i in {1..10}; do
            echo "Attempt $i: Installing synap-git==$TAG_VERSION..."
            if uv pip install --no-cache-dir "synap-git==$TAG_VERSION"; then
              echo "✓ Successfully installed synap-git==$TAG_VERSION"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "✗ Failed to install synap-git==$TAG_VERSION after 10 attempts."
              exit 1
            fi
            echo "Waiting 30 seconds for PyPI index..."
            sleep 30
          done

          mkdir test_repo && cd test_repo
          git init -b main
          git config --global user.email "release@synapse.local"
          git config --global user.name "Synap Release"
          git commit -m "init" --allow-empty

          # Verify package versions
          INSTALLED_VERSION=$(synap --version)
          echo "Installed Version: $INSTALLED_VERSION"
          if [[ "$INSTALLED_VERSION" != *"$TAG_VERSION"* ]]; then
            echo "ERROR: Installed version mismatch!"
            exit 1
          fi

          synap --help

          # Verify initialization and daemon boot
          synap init . --skip-llm --quiet
          synap start .
          sleep 5
          synap status .
          synap stop .

          # Verify doctor repairs and status
          synap doctor .

          # Verify update command works
          synap update

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: post-publish-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Generate Changelog Section
        id: build_changelog
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Generating release notes for $TAG_NAME"
          # Extract notes from CHANGELOG.md if matching tag header is found
          # Otherwise default to basic changelog
          cat << 'EOF' > release_notes.md
          # Synap Release ${{ github.ref_name }}

          Persistent, deterministic Git-aware structural retrieval engine for AI coding agents.

          ## Installation

          ```bash
          pip install synap-git
          ```

          ## Verification

          After installation, verify your environment:
          ```bash
          synap --help
          synap init .
          synap doctor .
          ```
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
